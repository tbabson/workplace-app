services:
  app:
    build: .
    container_name: workplace_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT:-5002}:5002" # direct access for local debugging only; use nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workplace_net
    volumes:
      - ./.env:/root/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16.3-alpine3.20
    container_name: workplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Workplace2024Secure}
      POSTGRES_DB: ${POSTGRES_DB:-workplace}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5555}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Every migration runs in filename order on first start (empty data volume).
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workplace}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - workplace_net

  redis:
    image: redis:7.2-alpine
    container_name: workplace_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6500}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workplace_net

  nginx:
    image: nginx:1.27-alpine
    container_name: workplace_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - workplace_net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: workplace_mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025" # Web UI — open http://localhost:<MAILHOG_UI_PORT>
    networks:
      - workplace_net

volumes:
  postgres_data:
  redis_data:

networks:
  workplace_net:
    driver: bridge
